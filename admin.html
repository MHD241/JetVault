<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071019"><title>Manager Studio — JetVault</title>
<meta name="description" content="JetVault aviation photography archive and community.">
<link rel="icon" href="assets/images/ui/favicon.svg"><link rel="stylesheet" href="assets/css/styles-v7-2.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="assets/js/config.js"></script><script defer src="assets/js/backend-v7.js"></script><script defer src="assets/js/main.js"></script>
<script defer src="assets/js/admin.js"></script>
</head><body data-page="admin"><header data-site-header></header><main>
<section class="section"><div class="container" data-admin-root><div class="section-head"><div><span class="eyebrow">Manager Studio</span><h2>JetVault operations.</h2><p>Signed in as <b data-manager-name>manager</b>.</p></div></div><div data-admin-status class="status">Checking access…</div>
<div class="two-col"><div class="panel"><h3>Pending moderation</h3><div class="admin-list" data-pending-list></div></div><form class="panel form-grid" data-admin-upload><h3 class="wide">Crew upload</h3><input class="wide" type="file" name="image" accept="image/*" required><input name="registration" placeholder="Registration" required><input name="aircraft_type" placeholder="Aircraft type" required><input name="airline" placeholder="Operator" required><input name="airport" placeholder="Airport code" required><input class="wide" name="taken_at" type="date"><textarea class="wide" name="caption" placeholder="Caption"></textarea><button class="solid-button wide">Publish optimised photo</button></form></div>
<div class="panel" style="margin-top:18px"><span class="eyebrow">Legacy archive repair</span><h3>Thumbnail migration</h3><p data-migration-copy>Manager Studio will automatically create lightweight thumbnails for old photographs.</p><div class="progress"><i data-migration-meter style="width:0%"></i></div><button class="outline-button" data-run-migration style="margin-top:12px">Run migration again</button></div></div></section>
</main><footer data-site-footer></footer></body></html>

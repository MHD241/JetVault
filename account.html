<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071019"><title>Account — JetVault</title>
<meta name="description" content="JetVault aviation photography archive and community.">
<link rel="icon" href="assets/images/ui/favicon.svg"><link rel="stylesheet" href="assets/css/styles-v7-2.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="assets/js/config.js"></script><script defer src="assets/js/backend-v7.js"></script><script defer src="assets/js/main.js"></script>
<script defer src="assets/js/account-v7.js"></script>
</head><body data-page="account"><header data-site-header></header><main>
<section class="section"><div class="container"><div data-account-message class="status" hidden></div>
<div data-account-guest hidden><div class="section-head"><div><span class="eyebrow">JetVault account</span><h2>Join the flightline.</h2></div></div><div class="auth-grid"><form class="panel" data-login-form><h3>Sign in</h3><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required style="margin-top:10px"><button class="solid-button" style="margin-top:12px">Sign in</button></form><form class="panel" data-signup-form><h3>Create account</h3><input name="display_name" placeholder="Display name" required><input name="email" type="email" placeholder="Email" required style="margin-top:10px"><input name="password" type="password" minlength="8" placeholder="Password" required style="margin-top:10px"><button class="solid-button" style="margin-top:12px">Create account</button></form></div></div>
<div data-account-dashboard hidden><div class="section-head"><div><span class="eyebrow">My JetVault</span><h2 data-account-name>Account</h2></div><button class="outline-button" data-signout>Sign out</button></div><div class="two-col"><form class="panel form-grid" data-profile-form><h3 class="wide">Profile</h3><input name="display_name" placeholder="Display name"><input name="username" placeholder="Username"><textarea class="wide" name="bio" placeholder="Bio"></textarea><input name="location" placeholder="Location"><input name="favourite_airport" placeholder="Favourite airport"><input class="wide" name="favourite_aircraft" placeholder="Favourite aircraft"><button class="solid-button wide">Save profile</button></form>
<form class="panel form-grid" data-upload-form><h3 class="wide">Upload photograph</h3><input class="wide" name="image" type="file" accept="image/*" required><input name="registration" placeholder="Registration" required><input name="aircraft_type" placeholder="Aircraft type" required><input name="airline" placeholder="Airline / operator" required><input name="airport" placeholder="Airport code" required><input class="wide" name="taken_at" type="date"><textarea class="wide" name="caption" placeholder="Caption"></textarea><button class="solid-button wide">Upload & optimise</button></form></div><div class="section-head" style="margin-top:28px"><div><h2>My submissions</h2></div></div><div class="cards" data-submissions></div></div></div></section>
</main><footer data-site-footer></footer></body></html>
